apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-admin-scheduler

spec:
  replicas: 1
  selector:
    matchLabels:
      app: domain-admin-scheduler
  template:
    metadata:
      labels:
        app: domain-admin-scheduler
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: scheduler
          image: registry.example.com/sre/scheduler:v1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: domain-admin-config
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: TZ
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-admin-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-admin-secrets
                  key: ADMIN_PASSWORD
            - name: SCHEDULER_ENABLED
              value: "true"
            - name: SCHEDULER_ROLE
              value: "worker"
          volumeMounts:
            - name: logs-dir
              mountPath: /app/logs
            - name: temp-dir
              mountPath: /app/temp
      volumes:
        - name: logs-dir
          emptyDir: {}
        - name: temp-dir
          emptyDir: {}