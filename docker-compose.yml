services:
  mysql:
    image: mysql:8.0
    container_name: domain-admin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-domainadmin123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-data}
      MYSQL_USER: ${MYSQL_USER:-domainadmin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-domainadmin123}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-domainadmin123}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: domain-admin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./domain-admin
      dockerfile: Dockerfile
      network: host
      args:
        BASE_IMAGE: domain-admin-base:latest
    container_name: domain-admin-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/backend.env
    environment:
      TZ: Asia/Shanghai
      SCHEDULER_ENABLED: "false"
      SCHEDULER_ROLE: none
    volumes:
      - ./data/backend:/app/database
      - ./logs/backend:/app/logs
      - ./data/temp:/app/temp
    expose:
      - "8000"

  frontend:
    build:
      context: ./domain-admin-web
      dockerfile: Dockerfile
      network: host
      args:
        VITE_APP_API: /api
        VITE_BASE_URL: /
    container_name: domain-admin-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-8080}:80"

  worker:
    build:
      context: ./domain-admin
      dockerfile: Dockerfile.worker
      network: host
      args:
        BASE_IMAGE: domain-admin-base:latest
    container_name: domain-admin-worker
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/backend.env
    environment:
      TZ: Asia/Shanghai
      SCHEDULER_ENABLED: "false"
      SCHEDULER_ROLE: none
    volumes:
      - ./data/backend:/app/database
      - ./logs/backend:/app/logs
      - ./data/temp:/app/temp

  scheduler:
    build:
      context: ./domain-admin
      dockerfile: Dockerfile.scheduler
      network: host
      args:
        BASE_IMAGE: domain-admin-base:latest
    container_name: domain-admin-scheduler
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/backend.env
    environment:
      TZ: Asia/Shanghai
      SCHEDULER_ENABLED: "true"
      SCHEDULER_ROLE: worker
    volumes:
      - ./data/backend:/app/database
      - ./logs/backend:/app/logs
      - ./data/temp:/app/temp

networks:
  default:
    name: domain-admin-net
