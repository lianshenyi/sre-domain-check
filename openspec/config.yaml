schema: spec-driven

# Project context: shown to the AI when creating artifacts.
context: |
  项目：域名 / SSL 证书监控平台（sre-domain-check）。
  后端：Python 3.10、Flask、Peewee、RQ worker、APScheduler、MySQL 8、Redis 7。
  前端：Vue 3、Vite 3、Element Plus、Pinia、Nginx。
  部署：单机 Docker Compose，6 个服务（mysql、redis、backend、worker、scheduler、frontend）。
  文档：根目录 prd.md / spec.md / tasks.md / CLAUDE.md / AGENTS.md；docs/ 按 YYYYMMDD-NN-主题.md 记录变更。
  约定：中文文档；env_file 不展开 ${...}，示例值用字面量；仅 scheduler 开启 SCHEDULER_ENABLED；Redis DB 0 缓存、DB 1 队列；公开仓库不得包含真实凭据、内网 IP、内部域名。

rules:
  proposal:
    - 说明用户价值、范围与非目标，并列出对现有 compose / 环境变量的影响。
    - 涉及部署行为变化时，必须给出验证命令。
  tasks:
    - 任务拆到可独立验证的粒度，并标注关联的 PRD / spec 章节。
  design:
    - 优先复用现有服务角色与配置，不引入新的运行时组件，除非有明确理由。
