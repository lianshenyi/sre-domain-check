apiVersion: v1
kind: Secret
metadata:
  name: domain-admin-secrets

type: Opaque
stringData:
  # 部署前替换为实际值，禁止提交真实凭据
  MYSQL_ROOT_PASSWORD: "<mysql-root-password>"
  MYSQL_DATABASE: "<database>"
  MYSQL_USER: "<db-user>"
  MYSQL_PASSWORD: "<db-password>"
  ADMIN_USERNAME: "<admin-user>"
  ADMIN_PASSWORD: "<admin-password>"

