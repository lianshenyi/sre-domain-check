apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-admin-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: domain-admin-backend
  template:
    metadata:
      labels:
        app: domain-admin-backend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: backend
          image: registry.example.com/sre/backend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: TZ
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: APP_MODE
            - name: ENABLED_REGISTER
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: ENABLED_REGISTER
            - name: CACHE_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: CACHE_BACKEND
            - name: ASYNC_TASK_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: ASYNC_TASK_BACKEND
            - name: REDIS_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_PREFIX
            - name: REDIS_CACHE_DB
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_CACHE_DB
            - name: REDIS_ASYNC_DB
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_ASYNC_DB
            - name: REDIS_TASK_RESULT_TTL
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_TASK_RESULT_TTL
            - name: REDIS_LOCK_TTL
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_LOCK_TTL
            - name: DB_CONNECT_URL
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: DB_CONNECT_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: domain-admin-config
                  key: REDIS_URL
            - name: ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: domain-admin-secrets
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: domain-admin-secrets
                  key: ADMIN_PASSWORD
            - name: SCHEDULER_ENABLED
              value: "false"
            - name: SCHEDULER_ROLE
              value: "none"
          volumeMounts:
            - name: logs-dir
              mountPath: /app/logs
            - name: temp-dir
              mountPath: /app/temp
          readinessProbe:
            httpGet:
              path: /test
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /test
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: logs-dir
          emptyDir: {}
        - name: temp-dir
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: domain-admin-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: domain-admin-frontend
  template:
    metadata:
      labels:
        app: domain-admin-frontend
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: frontend
          image: registry.example.com/sre/frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: nginx-conf
          configMap:
            name: domain-admin-frontend-nginx
---
