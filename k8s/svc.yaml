apiVersion: v1
kind: Service
metadata:
  name: domain-admin-frontend

spec:
  selector:
    app: domain-admin-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: domain-admin-backend

spec:
  selector:
    app: domain-admin-backend
  ports:
    - port: 8000
      targetPort: 8000